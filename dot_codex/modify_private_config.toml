{{- /* chezmoi:modify-template */ -}}
{{- $pinned := dict -}}
{{- if eq .workstation_type "work" -}}
{{-   $pinned = dict
  "model_provider" "litellm"
  "model" "openai-glob-sol-61-expensive"
  "model_providers.litellm" (dict
    "name" "Eventim LiteLLM"
    "base_url" "https://litellm.stg.enablement.ai.eventim.cloud/v1"
    "wire_api" "responses"
    "auth" (dict "command" (joinPath .chezmoi.homeDir ".local/bin/entra-cli-auth"))
  )
  "mcp_servers.eventim-mcp" (dict
    "command" (joinPath .chezmoi.homeDir ".local/bin/eventim-mcp")
  )
  "analytics.enabled" false
  "otel.metrics_exporter" "none"
  "features.apps" true
  "features.remote_plugin" false
  "features.plugin_discovery_prefetch" false
  "features.plugin_sharing" false
  "apps.teams.enabled" true
-}}
{{- else -}}
{{-   $pinned = dict "analytics.enabled" false "otel.metrics_exporter" "none" "apps.teams.enabled" true -}}
{{- end -}}
{{- $removed := list -}}
{{- if eq .workstation_type "work" -}}
{{-   $removed = list "forced_login_method" -}}
{{- end -}}
{{- includeTemplate "pin-settings" (dict "stdin" .chezmoi.stdin "format" "toml" "pinned" $pinned "removed" $removed) -}}
