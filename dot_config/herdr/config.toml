onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"
focus_pane_left = "super+ctrl+h"
focus_pane_down = "super+ctrl+j"
focus_pane_up = "super+ctrl+k"
focus_pane_right = "super+ctrl+l"
split_vertical = "prefix+l"
split_horizontal = "prefix+j"
focus_agent = "super+ctrl+1..9"
switch_tab = "prefix+shift+1..9"
switch_workspace = "prefix+1..9"
new_workspace = "prefix+n"
new_tab = "prefix+shift+n"
zoom = "prefix+f"

[ui]
confirm_close = false
prompt_new_tab_name = true
pane_borders = "always"
pane_gaps = false
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[update]
version_check = false
manifest_check = false

[worktrees]
directory = "~/Developer/worktrees/herdr"
