onboarding = false

[theme]
name = "terminal"
auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"

[ui]
sidebar_start_collapsed = false
pane_borders = "auto"
pane_outer_borders = true
pane_scrollbars = true
pane_gaps = true
hide_tab_bar_when_single_tab = false
confirm_close = true
prompt_new_tab_name = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
